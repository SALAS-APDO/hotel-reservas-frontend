<nav class="navbar">
  <div class="brand">
    <h1 routerLink="/" style="cursor: pointer; display: flex; align-items: center; gap: 8px; color: black;">
      Hoteles UPN
    </h1>
  </div>

  <ul class="nav-links">
    @if (!isAdmin) {
    <li><a routerLink="/destinos" style="color: black;">Destinos</a></li>
    <li><a routerLink="/" style="color: black;">Hoteles</a></li>
    <li><a routerLink="/nosotros" style="color: black;">Nosotros</a></li>
    }
  </ul>

  <div class="actions">
    <button *ngIf="!isLogged" routerLink="/login" class="btn-login">Iniciar sesión</button>

    <button *ngIf="isLogged" (click)="cerrarSesion()" class="btn-logout"
      style="background-color: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;">
      Cerrar sesión <app-icon name="logout" [size]="16"></app-icon>
    </button>
  </div>
</nav>
