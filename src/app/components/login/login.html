<div class="login-container">

  <div class="toast-notification" *ngIf="mostrarToast" [ngClass]="tipoToast">
    <app-icon [name]="tipoToast === 'exito' ? 'check-circle' : 'warning-circle'" [size]="24"></app-icon>
    <span>{{ mensajeToast }}</span>
    <div class="toast-progress"></div>
  </div>

  <div class="login-card">

    <a routerLink="/" class="btn-volver">← Volver a la vista pública</a>

    <div class="login-header">
      <h2 style="display: flex; align-items: center; justify-content: center; gap: 8px;">
        Panel UPN
      </h2>
      <p>Acceso exclusivo para administradores</p>
    </div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="form-group">
        <label for="correo">Usuario / Correo Electrónico</label>
        <input type="text" id="correo" name="correo" [(ngModel)]="credenciales.correo" placeholder="Ej. juanc"
          required />
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" [(ngModel)]="credenciales.contrasena"
          placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-login"
        style="display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
        Ingresar al Sistema <app-icon name="key" [size]="18"></app-icon>
      </button>
    </form>
  </div>
</div>
