<div class="habitaciones-container">
  
  <div class="header-contenido" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
    <h2 style="display: flex; align-items: center; gap: 8px; margin: 0;">
      <app-icon name="bed" [size]="24" style="color: #0f529f;"></app-icon> Estado de Habitaciones
    </h2>
    <div class="leyenda">
      <span class="badge-leyenda"><span class="dot bg-libre"></span> Disponible</span>
      <span class="badge-leyenda"><span class="dot bg-ocupada"></span> Ocupada</span>
      <span class="badge-leyenda"><span class="dot bg-limpieza"></span> Limpieza</span>
    </div>
  </div>

  <div style="margin-bottom: 20px;">
    <input type="text" placeholder="🔍 Buscar habitación por número (ej. M101, S205)..." [(ngModel)]="filtroTexto" style="width: 100%; max-width: 400px; padding: 10px 15px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 1rem; outline: none;">
  </div>

  <div class="grid-habitaciones">
    
    <div *ngFor="let hab of habitacionesFiltradas" 
         class="tarjeta-habitacion" 
         [ngClass]="{
           'estado-libre': hab.estado === 'DISPONIBLE',
           'estado-ocupada': hab.estado === 'OCUPADA',
           'estado-limpieza': hab.estado === 'LIMPIEZA'
         }">
      
      <div class="tarjeta-header">
        <h3>{{ hab.numeroHabitacion }}</h3>
        <span class="icono-estado" [ngSwitch]="hab.estado">
          <app-icon *ngSwitchCase="'DISPONIBLE'" name="check" [size]="18" style="color: #10b981;"></app-icon>
          <app-icon *ngSwitchCase="'OCUPADA'" name="lock" [size]="18" style="color: #ef4444;"></app-icon>
          <app-icon *ngSwitchCase="'LIMPIEZA'" name="broom" [size]="18" style="color: #eab308;"></app-icon>
          <app-icon *ngSwitchDefault name="help" [size]="18" style="color: #64748b;"></app-icon>
        </span>
      </div>
      
      <div class="tarjeta-body">
        <p><strong>Tipo:</strong> {{ hab.tipoHabitacion }}</p>
        <p style="display: flex; align-items: center; gap: 4px; margin: 8px 0;">
          <strong>Capacidad:</strong>
          <app-icon name="users" [size]="14" style="color: #64748b;"></app-icon>
          x{{ hab.capacidadMaxima }}
        </p>
        <p><strong>Precio:</strong> S/ {{ hab.precioPorNoche }}</p>
      </div>

      <div class="tarjeta-footer" style="text-align: center; font-weight: bold; padding: 12px; border-top: 1px solid rgba(0,0,0,0.05); text-transform: uppercase;">
        {{ hab.estado }}
      </div>
      
    </div>

  </div>

</div>
