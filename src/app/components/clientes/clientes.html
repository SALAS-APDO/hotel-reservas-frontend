<div class="header-contenido">
  <h2>Gestión de Clientes</h2>
</div>

<div class="tabla-container">
  <input type="text" placeholder="🔍 Buscar por DNI o Apellido..." class="buscador" [(ngModel)]="filtroTexto">

  <table class="tabla-admin">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombres</th>
        <th>Apellidos</th>
        <th>Tipo Doc</th>
        <th>Documento</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cli of clientesFiltrados">
        <td>#{{ cli.idCliente }}</td>
        <td>{{ cli.nombre }}</td>
        <td>{{ cli.apellido }}</td>
        <td>{{ cli.tipoDocumento }}</td>
        <td>{{ cli.numeroDocumento }}</td>
        <td>{{ cli.correo }}</td>
        <td>{{ cli.telefono }}</td>
        <td class="acciones-celda">
          <button class="btn-accion btn-editar" title="Corregir Datos" (click)="abrirModalEditar(cli)">✏️</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="modal-overlay" *ngIf="mostrarModalEdicion">
  <div class="modal-content">
    <h3>✏️ Modificar Datos del Cliente</h3>
    <form (ngSubmit)="guardarEdicion()">
      <div class="form-group">
        <label>Nombres:</label>
        <input type="text" [(ngModel)]="clienteEditando.nombre" name="nombre" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Apellidos:</label>
        <input type="text" [(ngModel)]="clienteEditando.apellido" name="apellido" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Correo Electrónico:</label>
        <input type="email" [(ngModel)]="clienteEditando.correo" name="correo" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Teléfono:</label>
        <input type="text" [(ngModel)]="clienteEditando.telefono" name="telefono" class="form-control">
      </div>
      <div class="modal-acciones">
        <button type="button" class="btn-cancelar" (click)="cerrarModal()">❌ Cancelar</button>
        <button type="submit" class="btn-guardar">💾 Guardar</button>
      </div>
    </form>
  </div>
</div>
